<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./dist/output.css" rel="stylesheet">
  <title>Twitter Clone</title>
</head>

<body class="bg-black text-white">
  <div class="max-w-[1700px] mx-auto flex justify-center items-start">

    <!-- ── Left Sidebar Navigation ── -->
    <nav class="hidden sm:flex w-16 md:w-20 lg:w-1/5 h-screen sticky top-0 border-r dark:border-neutral-800 p-2 lg:p-3 flex-col justify-between shrink-0">
      <div class="flex-1 min-h-0 overflow-y-auto scrollbar-thin flex flex-col">
        <!-- Twitter Logo -->
        <svg viewBox="0 0 24 24" aria-hidden="true" class="w-8 h-8 fill-current mb-1 ml-3">
          <path d="M23.643 4.937c-.835.37-1.732.62-2.675.733.962-.576 1.7-1.49 2.048-2.578-.9.534-1.897.922-2.958 1.13-.85-.904-2.06-1.47-3.4-1.47-2.572 0-4.658 2.086-4.658 4.66 0 .364.042.718.12 1.06-3.873-.195-7.304-2.05-9.602-4.868-.4.69-.63 1.49-.63 2.342 0 1.616.823 3.043 2.072 3.878-.764-.025-1.482-.234-2.11-.583v.06c0 2.257 1.605 4.14 3.737 4.568-.392.106-.823.162-1.258.162-.307 0-.605-.03-.895-.088.605 1.89 2.367 3.268 4.455 3.308-1.594 1.25-3.6 1.997-5.786 1.997-.376 0-.747-.022-1.112-.065 2.062 1.323 4.51 2.093 7.14 2.093 8.57 0 13.255-7.098 13.255-13.254 0-.2-.005-.402-.014-.602.91-.658 1.7-1.477 2.323-2.41z"/>
        </svg>

        <!-- Nav items injected by app.js -->
        <ul id="nav-items" class="flex flex-col items-center lg:items-start gap-0"></ul>

        <!-- Post / Tweet Button -->
        <button class="bg-blue-400 text-white font-bold w-10 h-10 lg:w-full lg:h-auto p-0 lg:py-3.5 lg:px-4 mt-3 rounded-full text-base hover:bg-blue-500 transition flex items-center justify-center">
          <span class="hidden lg:inline">Tweet</span>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="w-6 h-6 fill-current lg:hidden">
            <path d="M12 2.595l5.707 5.707-1.414 1.414L13 6.414V16h-2V6.414l-3.293 3.293-1.414-1.414L12 2.595zM21 20v-7h2v7c0 1.103-.897 2-2 2H3c-1.103 0-2-.897-2-2v-7h2v7h18z"/>
          </svg>
        </button>
      </div>

      <!-- User Profile Footer -->
      <div class="flex items-center justify-center lg:justify-start gap-3 p-2 lg:p-3 hover:bg-gray-900 rounded-full cursor-pointer transition mb-2">
        <img src="https://pbs.twimg.com/profile_images/1710911871551685633/0r6g1j7A_400x400.jpg" alt="User Avatar" class="w-9 h-9 rounded-full shrink-0">
        <div class="hidden lg:block min-w-0">
          <div class="font-bold text-sm truncate">Ryan Ross</div>
          <div class="text-gray-500 text-sm truncate">@ross_ryan38740</div>
        </div>
      </div>
    </nav>

    <!-- ── Main Feed ── -->
    <main class="w-full sm:flex-1 sm:min-w-0 lg:w-1/2 lg:flex-none border-r dark:border-neutral-800 min-h-screen">

      <!-- Header -->
      <header class="sticky top-0 bg-black/80 backdrop-blur z-10">
        <div class="flex justify-between items-center px-3 sm:px-5 py-4">
          <h1 class="text-xl sm:text-2xl font-bold text-white">Home</h1>
          <button class="p-2 rounded-full hover:bg-white/10 text-white transition cursor-pointer flex items-center justify-center">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="w-7 h-7 sm:w-8 sm:h-8 fill-current">
              <path d="M10.5 3.5c.3-.8 1.5-.8 1.8 0l1.3 3.1c.2.4.5.7.9.9l3.1 1.3c.8.3.8 1.5 0 1.8l-3.1 1.3c-.4.2-.7.5-.9.9l-1.3 3.1c-.3.8-1.5.8-1.8 0l-1.3-3.1c-.2-.4-.5-.7-.9-.9l-3.1-1.3c-.8-.3-.8-1.5 0-1.8l3.1-1.3c.4-.2.7-.5.9-.9l1.3-3.1zM19 13.5c.2-.5 1-.5 1.2 0l.4 1.1c.1.3.4.6.7.7l1.1.4c.5.2.5 1 0 1.2l-1.1.4c-.3.1-.6.4-.7.7l-.4 1.1c-.2.5-1 .5-1.2 0l-.4-1.1c-.1-.3-.4-.6-.7-.7l-1.1-.4c-.5-.2-.5-1 0-1.2l1.1-.4c.3-.1.6-.4.7-.7l.4-1.1zM6 14.5c.2-.5 1-.5 1.2 0l.4 1.1c.1.3.4.6.7.7l1.1.4c.5.2.5 1 0 1.2l-1.1.4c-.3.1-.6.4-.7.7l-.4 1.1c-.2.5-1 .5-1.2 0l-.4-1.1c-.1-.3-.4-.6-.7-.7l-1.1-.4c-.5-.2-.5-1 0-1.2l1.1-.4c.3-.1.6-.4.7-.7l.4-1.1z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Compose Box -->
      <div class="p-2 border-b dark:border-neutral-800 flex flex-col gap-4 items-center flex-wrap">
        <div class="w-full p-2 sm:p-4">
          <div class="flex flex-row gap-2 sm:gap-3">
            <img src="https://pbs.twimg.com/profile_images/1710911871551685633/0r6g1j7A_400x400.jpg" alt="User Avatar" class="w-10 h-10 sm:w-12 sm:h-12 rounded-full shrink-0">
            <!-- The tweet Input Field. -->
            <textarea id="compose-input" class="text-xl sm:text-3xl w-full min-w-0 outline-none resize-none bg-transparent placeholder-gray-600 text-white" placeholder="What is happening?" rows="2"></textarea>
          </div>
          <div class="flex justify-between items-center flex-wrap gap-2">
            <div class="text-blue-400 flex gap-1 sm:gap-2 items-center flex-wrap px-0 sm:px-10">
              <button class="p-1.5 sm:p-2 hover:bg-blue-400 hover:scale-110 hover:text-white rounded-full transition cursor-pointer">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="w-6 h-6 sm:w-8 sm:h-8 fill-current"><path d="M3 5.5C3 4.119 4.119 3 5.5 3h13C19.881 3 21 4.119 21 5.5v13c0 1.381-1.119 2.5-2.5 2.5h-13C4.119 21 3 19.881 3 18.5v-13zM5.5 5c-.276 0-.5.224-.5.5v9.086l3-3 3 3 5-5 3 3V5.5c0-.276-.224-.5-.5-.5h-13zM19 15.414l-3-3-5 5-3-3-3 3V18.5c0 .276.224.5.5.5h13c.276 0 .5-.224.5-.5v-3.086zM9.75 7C8.784 7 8 7.784 8 8.75s.784 1.75 1.75 1.75 1.75-.784 1.75-1.75S10.716 7 9.75 7z"/></svg>
              </button>
              <button class="p-1.5 sm:p-2 hover:bg-blue-400 hover:scale-110 hover:text-white rounded-full transition cursor-pointer">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="w-6 h-6 sm:w-8 sm:h-8 fill-current"><path d="M3 5.5C3 4.119 4.119 3 5.5 3h13C19.881 3 21 4.119 21 5.5v13c0 1.381-1.119 2.5-2.5 2.5h-13C4.119 21 3 19.881 3 18.5v-13zM5.5 5c-.276 0-.5.224-.5.5v13c0 .276.224.5.5.5h13c.276 0 .5-.224.5-.5v-13c0-.276-.224-.5-.5-.5h-13zM8 9.5v5H9.5V12H11v-1.5H9.5V9.5H8zm5-1.5h3.5c.276 0 .5.224.5.5s-.224.5-.5.5h-3v1.5h3c.276 0 .5.224.5.5s-.224.5-.5.5h-3V14h3c.276 0 .5.224.5.5s-.224.5-.5.5h-3.5c-.276 0-.5-.224-.5-.5v-6c0-.276.224-.5.5-.5z"/></svg>
              </button>
              <button class="p-1.5 sm:p-2 hover:bg-blue-400 hover:scale-110 hover:text-white rounded-full transition cursor-pointer">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="w-6 h-6 sm:w-8 sm:h-8 fill-current"><path d="M8.688 13.453c.067.13.137.248.215.367.683 1.058 1.875 1.658 3.1 1.655 1.225.005 2.416-.593 3.095-1.652.077-.119.146-.238.212-.367l1.38.588c-.07.188-.146.365-.237.545-.788 1.628-2.629 2.714-4.452 2.686-1.824.024-3.658-1.061-4.451-2.685-.092-.18-.169-.356-.238-.543l1.376-.594zM9.25 8c.828 0 1.5.796 1.5 1.9 0 1.105-.672 1.85-1.5 1.85s-1.5-.745-1.5-1.85c0-1.104.672-1.9 1.5-1.9zm5.5 0c.828 0 1.5.796 1.5 1.9 0 1.105-.672 1.85-1.5 1.85s-1.5-.745-1.5-1.85c0-1.104.672-1.9 1.5-1.9z"/><path clip-rule="evenodd" d="M12.008 2c5.523 0 10 4.477 10 10s-4.477 10-10 10-10-4.477-10-10 4.477-10 10-10zm0 2c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8z" fill-rule="evenodd"/></svg>
              </button>
              <button class="p-1.5 sm:p-2 hover:bg-blue-400 hover:scale-110 hover:text-white rounded-full transition cursor-pointer">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="w-6 h-6 sm:w-8 sm:h-8 fill-current"><path d="M6 5c-1.1 0-2 .895-2 2s.9 2 2 2 2-.895 2-2-.9-2-2-2zM2 7c0-2.209 1.79-4 4-4s4 1.791 4 4-1.79 4-4 4-4-1.791-4-4zm20 1H12V6h10v2zM6 15c-1.1 0-2 .895-2 2s.9 2 2 2 2-.895 2-2-.9-2-2-2zm-4 2c0-2.209 1.79-4 4-4s4 1.791 4 4-1.79 4-4 4-4-1.791-4-4zm20 1H12v-2h10v2z"/></svg>
              </button>
            </div>
            <!-- The Tweet button. -->
            <button id="compose-btn" class="bg-blue-400 text-white text-lg sm:text-xl font-bold px-4 sm:px-5 py-2 rounded-full hover:bg-blue-500 transition cursor-pointer shrink-0">Tweet</button>
          </div>
        </div>
      </div>

      <!-- Tweet feed by app.js -->
      <div id="tweet-feed" class="flex flex-col"></div>
    </main>

    <!-- ── Right Sidebar ── -->
    <aside class="hidden xl:flex w-1/3 h-screen sticky top-0 overflow-y-auto scrollbar-thin p-3 flex-col gap-2 ml-4">

      <!-- Search Bar -->
      <div class="sticky top-0 py-2">
        <div class="relative flex items-center">
          <span class="absolute left-4 text-gray-500">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="w-7 h-7 fill-current">
              <path d="M10.25 3.75c-3.59 0-6.5 2.91-6.5 6.5s2.91 6.5 6.5 6.5c1.795 0 3.419-.726 4.621-1.899l3.858 3.858 1.414-1.414-3.858-3.858c1.173-1.202 1.899-2.826 1.899-4.621 0-3.59-2.91-6.5-6.5-6.5zm0 2c2.485 0 4.5 2.015 4.5 4.5s-2.015 4.5-4.5 4.5-4.5-2.015-4.5-4.5 2.015-4.5 4.5-4.5z"/>
            </svg>
          </span>
          <input class="bg-gray-900 text-white pl-12 pr-4 py-4 rounded-full w-full outline-none focus:bg-black focus:border focus:border-blue-400 transition text-lg" type="text" placeholder="Search Twitter">
        </div>
      </div>

      <!-- Trends For You Card -->
      <div class="bg-gray-900 rounded-2xl overflow-hidden">
        <h2 class="font-bold text-xl px-4 pt-4 mb-2">Trends for you</h2>
        <div id="trends-list"></div>
        <div class="p-4 hover:bg-gray-800 cursor-pointer transition">
          <p class="text-blue-400 text-lg">Show more</p>
        </div>
      </div>

      <!-- Who to Follow Card -->
      <div class="bg-gray-900 rounded-2xl overflow-hidden">
        <h2 class="font-bold text-2xl px-4 pt-4 mb-2">Who to follow</h2>
        <div id="follow-list"></div>
        <div class="p-4 hover:bg-gray-800 cursor-pointer transition">
          <p class="text-blue-400 text-lg">Show more</p>
        </div>
      </div>

      <!-- Footer Links -->
      <div class="px-4 text-md text-gray-500">
        <div class="flex flex-wrap gap-2">
          <a href="#" class="hover:underline">Terms of Service</a>
          <a href="#" class="hover:underline">Privacy Policy</a>
          <a href="#" class="hover:underline">Cookie Policy</a>
          <a href="#" class="hover:underline">Accessibility</a>
          <a href="#" class="hover:underline">Ads info</a>
          <a href="#" class="hover:underline">More...</a>
          <p>© 2022 Twitter, Inc.</p>
        </div>
      </div>
    </aside>
  </div>

  <!-- ── Mobile Bottom Nav ── -->
  <nav class="sm:hidden fixed bottom-0 left-0 right-0 bg-black border-t dark:border-neutral-800 flex justify-around items-center py-2 z-20">
    <button class="p-2 rounded-full hover:bg-white/10 transition">
      <svg viewBox="0 0 24 24" class="w-7 h-7 fill-current"><path d="M21.58 13.06l-1.52-1.51-7.06-7c-.54-.53-1.42-.53-1.96 0l-7.06 7-1.52 1.51c-.39.4-.39 1.03 0 1.42.19.2.46.3.71.3h1.27v6.23c0 .55.45 1 1 1h4V14h4v5.01h4c.55 0 1-.45 1-1v-6.23h1.27c.25 0 .52-.1.71-.3.4-.39.4-1.02 0-1.42z"/></svg>
    </button>
    <button class="p-2 rounded-full hover:bg-white/10 transition">
      <svg viewBox="0 0 24 24" class="w-7 h-7 fill-current"><path d="M10.25 3.75c-3.59 0-6.5 2.91-6.5 6.5s2.91 6.5 6.5 6.5c1.42 0 2.73-.46 3.81-1.24l4.97 4.97c.2.2.45.3.71.3s.51-.1.71-.29c.39-.39.39-1.03 0-1.42l-4.97-4.97c.78-1.08 1.24-2.39 1.24-3.81 0-3.59-2.91-6.5-6.5-6.5zm-4.5 6.5c0-2.48 2.02-4.5 4.5-4.5s4.5 2.02 4.5 4.5-2.02 4.5-4.5 4.5-4.5-2.02-4.5-4.5z"/></svg>
    </button>
    <button class="p-2 rounded-full hover:bg-white/10 transition">
      <svg viewBox="0 0 24 24" class="w-7 h-7 fill-current"><path d="M21.16 14.85l-1.7-1.74V8.55c0-4.11-2.91-7.55-6.84-8.31V0H11.4v.24C7.45 1 4.54 4.44 4.54 8.55v4.56l-1.7 1.74C2.31 15.38 2 16.03 2 16.71V18c0 .55.45 1 1 1h6.05c.23 2.27 2.14 4 4.47 4s4.24-1.73 4.47-4H21c.55 0 1-.45 1-1v-1.29c0-.68-.31-1.33-.84-1.86zM13.52 21c-1.29 0-2.35-.91-2.48-2h4.96c-.13 1.09-1.19 2-2.48 2z"/></svg>
    </button>
    <button class="p-2 rounded-full hover:bg-white/10 transition">
      <svg viewBox="0 0 24 24" class="w-7 h-7 fill-current"><path d="M1.998 5.5c0-1.381 1.119-2.5 2.5-2.5h15c1.381 0 2.5 1.119 2.5 2.5v13c0 1.381-1.119 2.5-2.5 2.5h-15c-1.381 0-2.5-1.119-2.5-2.5v-13zm2.5-.5c-.276 0-.5.224-.5.5v.117l8 4.78 8-4.78V5.5c0-.276-.224-.5-.5-.5h-15zm15.5 2.457l-7.498 4.48c-.31.185-.7.185-1.004 0L3.998 7.457V18.5c0 .276.224.5.5.5h15c.276 0 .5-.224.5-.5V7.457z"/></svg>
    </button>
    <button class="p-1 rounded-full hover:bg-white/10 transition">
      <img src="https://pbs.twimg.com/profile_images/1710911871551685633/0r6g1j7A_400x400.jpg" alt="User Avatar" class="w-7 h-7 rounded-full">
    </button>
  </nav>
  <div class="sm:hidden h-16"></div>

  <!-- components must load before app.js which references their globals -->
  <script src="src/components/icons.js"></script>
  <script src="src/components/Nav.js"></script>
  <script src="src/components/Feed.js"></script>
  <script src="src/components/Sidebar.js"></script>
  <script src="src/app.js"></script>
</body>

</html>
